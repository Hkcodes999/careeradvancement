# /etc/nginx/sites-available/careeradvancement

# =======================================================================
# 1. API: cadv-api.careeradvancement.in
# =======================================================================

server {
    server_name cadv-api.careeradvancement.in;

    # SSL Configuration (Final - API)
    listen 443 ssl http2; 
    ssl_certificate /etc/letsencrypt/live/careeradvancement.in/fullchain.pem; # Assumes wildcard cert or explicitly generated cert
    ssl_certificate_key /etc/letsencrypt/live/careeradvancement.in/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

    # Main Backend (Port 7000 for Production)
    location / {
        client_max_body_size 50M;
        proxy_pass http://localhost:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP Headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP -> HTTPS Redirect for API
server {
   if ($host = cadv-api.careeradvancement.in) {
       return 301 https://$host$request_uri;
   }
   listen 80;
   server_name cadv-api.careeradvancement.in;
   return 404;
}


# =======================================================================
# 2. Frontend: careeradvancement.in
# =======================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name careeradvancement.in www.careeradvancement.in;

    # Certbot Challenges (Keep this open!)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
        allow all;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://careeradvancement.in$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name careeradvancement.in www.careeradvancement.in;

    # Change this path to where your frontend dist build lives
    root /var/www/careeradvancement/client-frontend;
    index index.html;

    # GZIP COMPRESSION - SAVES BANDWIDTH
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Logs - IMPORTANT for debugging 403s
    access_log /var/log/nginx/careeradvancement_access.log;
    error_log /var/log/nginx/careeradvancement_error.log warn;

    # SSL Config (Certbot managed paths)
    ssl_certificate /etc/letsencrypt/live/careeradvancement.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careeradvancement.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 1. ALLOW ROBOTS & SITEMAP EXPLICITLY
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    # 2. SERVE STATIC ASSETS CORRECTLY
    
    # Block A: Critical Assets (JS, CSS) - Must have correct MIME type + Immutable
    location ~* \.(js|css)$ {
        include /etc/nginx/mime.types;
        default_type application/javascript; # Fallback for JS if mime.types fails
        
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Security Headers
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header Access-Control-Allow-Origin "*";
    }

    # Block B: Media Assets (Images, Fonts) - Immutable
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webmanifest|webp)$ {
        include /etc/nginx/mime.types;
        
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Security Headers
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header Access-Control-Allow-Origin "*";
    }

    # 3. SPA ROUTING (React/Vite)
    # HTML must never be cached long-term to ensure users get the latest version.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # 4. CUSTOM ERROR PAGES
    error_page 404 /index.html;
    
    # 5. SECURITY HEADERS
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Cross-Origin-Resource-Policy "cross-origin";
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
    add_header Cross-Origin-Embedder-Policy "unsafe-none";

    # Content Security Policy (CSP)
    # Added api domains into connect-src so Axios requests function correctly
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' https: 'unsafe-eval' 'unsafe-inline' blob: https://accounts.google.com https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' https: 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https: blob: https://accounts.google.com; font-src 'self' data: https:; connect-src 'self' https: wss: data: blob: https://accounts.google.com https://cadv-api.careeradvancement.in wss://cadv-api.careeradvancement.in; frame-src 'self' https: https://accounts.google.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self';";

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()";
    add_header Accept-CH "Sec-CH-UA-Platform-Version";
}
